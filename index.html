<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Newsreader:ital,wght@1,500&amp;display=swap" rel="stylesheet">
<style>
:root{--page-green:#0F6E56;--page-mint:#A6E3CF;--page-cream:#F4EEDD;--page-orange:#DB5F33;--page-ink:#1F2A26;--page-wood:#B98A5A;--page-wood-dark:#8A5F38;--page-bg:var(--page-cream);--page-text:var(--page-ink);--page-sub:#5B645F;--page-shelf:linear-gradient(#C99B69,#9E6E42);}
[data-theme=dark]{--page-bg:#10201B;--page-text:#E4F3EC;--page-sub:#9FB8AE;--page-shelf:linear-gradient(#5A3E27,#38261A);}
*{box-sizing:border-box}
body{margin:0;background:var(--page-bg);color:var(--page-text);font-family:'DM Sans',system-ui,sans-serif;transition:background .3s,color .3s}
header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 24px 0;position:relative}
header img{width:180px;height:auto;display:block}
header h1{font-family:'Space Grotesk',Georgia,serif;font-size:40px;margin:0;font-weight:700}
.toggle{position:absolute;top:20px;right:24px;font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.bookcase{width:fit-content;max-width:100%;margin:28px auto 0;padding-top:28px;overflow:hidden}
nav{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 22px}
.shelf{height:16px;background:var(--page-shelf);border-radius:2px;box-shadow:0 8px 12px -6px rgba(0,0,0,.45)}
.bookcase-wrap{display:flex;justify-content:center}
.book{--h:104px;--w:40px;height:var(--h);width:var(--w);flex:none;border:0;padding:0;cursor:pointer;color:#fff;font:600 11px 'DM Sans',sans-serif;letter-spacing:.08em;
 display:flex;align-items:center;justify-content:center;border-radius:3px 3px 1px 1px;position:relative;
 box-shadow:inset 4px 0 0 rgba(255,255,255,.12),inset -5px 0 0 rgba(0,0,0,.18);transform-origin:bottom left;transition:transform .25s ease-out,box-shadow .25s}
.book span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.book::before,.book::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.35)}
.book::before{top:12px}.book::after{bottom:12px}
.book:hover,.book:focus-visible{transform:translateY(-18px) rotate(-3deg);box-shadow:inset 4px 0 0 rgba(255,255,255,.12),inset -5px 0 0 rgba(0,0,0,.18),0 10px 14px -8px rgba(0,0,0,.45);outline:none;z-index:2}
.book:focus-visible{outline:2px solid var(--page-orange);outline-offset:2px}
.book.active{transform:translateY(-10px)}
.book.active:hover{transform:translateY(-20px) rotate(-3deg)}
.book.active::before{background:var(--page-orange);height:5px}
.b1{background:#0F6E56;--h:112px}.b2{background:#DB5F33;--h:98px;--w:36px}.b3{background:#2C4A41;--h:118px;--w:44px}
.b4{background:#7C9A5E;--h:102px}.b5{background:#3D6C8C;--h:108px;--w:38px}.b6{background:#8C4A3A;--h:94px;--w:35px}
.lean{flex:none;width:30px;height:84px;background:#C9B98E;transform:rotate(16deg);transform-origin:bottom left;margin-left:4px;margin-right:18px;border-radius:3px;opacity:.85}
.opening{animation:tip .28s ease-in forwards}
@keyframes tip{to{transform:translateY(-40px) rotate(-10deg);opacity:0}}
main{padding:36px 24px;max-width:680px;margin:0 auto;text-align:center}
main h2{font-family:'Space Grotesk',Georgia,serif;font-size:clamp(28px,5vw,44px);margin:0 0 10px;line-height:1.15}
main p{color:var(--page-sub);font-size:17px;line-height:1.55;max-width:600px;margin:0 auto}
.page{animation:open .3s ease-out}
@keyframes open{from{opacity:0;transform:translateY(6px)}}
.meter{margin:24px auto 0;max-width:420px}.bar{height:10px;border-radius:5px;background:rgba(127,127,127,.25);overflow:hidden}.bar i{display:block;height:100%;width:70%;background:var(--page-orange)}
.meter small{display:block;margin-top:8px;color:var(--page-sub)}
@media (prefers-reduced-motion:reduce){.book,.page{transition:none;animation:none}.opening{animation:none}}
@media (max-width:600px){header{padding:56px 16px 0}header img{width:130px}main{padding:28px 16px}nav{padding:0 10px}}

main.wide{max-width:1200px;text-align:left;padding:28px 0 48px}
.row{margin-bottom:30px}
.row h3{font-family:'Space Grotesk',Georgia,serif;font-size:22px;margin:0 0 10px;padding:0 48px;display:flex;align-items:baseline;gap:10px}
.row h3 small{font:500 13px 'DM Sans',sans-serif;color:var(--page-sub)}
.rail{position:relative}
.track{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:14px 48px 18px;scrollbar-width:none;scroll-snap-type:x proximity}
.track::-webkit-scrollbar{display:none}
.cover{flex:none;width:132px;height:198px;border-radius:4px;position:relative;cursor:pointer;scroll-snap-align:start;border:0;padding:14px 12px;text-align:left;color:#fff;
 display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 6px 0 0 rgba(0,0,0,.18);transition:transform .22s ease-out,box-shadow .22s;font-family:'DM Sans',sans-serif}
.cover b{font:700 16px/1.2 'Space Grotesk',Georgia,serif}
.cover i{font-style:normal;font-size:11px;letter-spacing:.06em;opacity:.85;text-transform:uppercase}
.cover .prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.3);border-radius:0 0 4px 4px;overflow:hidden}
.cover .prog span{display:block;height:100%;background:var(--page-orange)}
.cover .info{position:absolute;inset:auto 0 0 0;padding:10px 12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));border-radius:0 0 4px 4px;font-size:12px;line-height:1.35;opacity:0;transition:opacity .2s}
.cover:hover,.cover:focus-visible{transform:scale(1.12);z-index:3;box-shadow:0 14px 26px rgba(0,0,0,.4),inset 6px 0 0 rgba(0,0,0,.18);outline:none}
.cover:hover .info,.cover:focus-visible .info{opacity:1}
.arrow{position:absolute;top:14px;bottom:18px;width:44px;border:0;cursor:pointer;font-size:30px;color:#fff;background:rgba(0,0,0,.45);z-index:4;opacity:0;transition:opacity .2s}
.arrow.l{left:0;border-radius:0 6px 6px 0}.arrow.r{right:0;border-radius:6px 0 0 6px}
.rail:hover .arrow,.arrow:focus-visible{opacity:1}
.arrow[disabled]{visibility:hidden}
@media (max-width:600px){.row h3,.track{padding-left:16px;padding-right:16px}.arrow{display:none}.cover{width:110px;height:165px}}
@media (prefers-reduced-motion:reduce){.cover{transition:none}.track{scroll-behavior:auto}}

.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;opacity:0;transition:opacity .3s}
.cover img.ok{opacity:1}
.cover.hasimg>i,.cover.hasimg>b{visibility:hidden}
.cover .prog,.cover .info{z-index:1}
.search{position:relative;max-width:560px;margin:0 auto 26px;padding:0 24px}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:10px;border:1px solid rgba(127,127,127,.45);background:rgba(255,255,255,.08);color:inherit}
.search input:focus{outline:2px solid var(--page-orange);outline-offset:1px}
.results{position:absolute;left:24px;right:24px;top:52px;z-index:10;background:var(--page-bg);border:1px solid rgba(127,127,127,.4);border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.3);max-height:420px;overflow-y:auto;display:none}
.results.open{display:block}
.res{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(127,127,127,.2)}
.res:last-child{border-bottom:0}
.res .th{width:42px;height:63px;flex:none;border-radius:3px;background:#7C9A5E center/cover no-repeat}
.res .tx{flex:1;min-width:0}.res .tx b{display:block;font:600 15px 'Space Grotesk',Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tx small{color:var(--page-sub);font-size:12px}
.res select{font:inherit;font-size:13px;padding:6px;border-radius:6px;background:var(--page-bg);color:inherit;border:1px solid rgba(127,127,127,.45)}
.res button{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:0;background:var(--page-green);color:#fff;cursor:pointer}
.status{padding:14px;color:var(--page-sub);font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--page-green);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

main.home{max-width:980px;text-align:left;padding:32px 24px 48px}
.now{display:grid;grid-template-columns:150px 1fr;gap:28px;align-items:center}
.now .cv{width:150px;height:225px;border-radius:4px;background:#2C4A41 center/cover no-repeat;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.now .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-orange);font-weight:600}
.now h2{text-align:left;margin:6px 0 4px}
.now .by{color:var(--page-sub);margin:0 0 18px}
.chap{font:600 20px 'Space Grotesk',Georgia,serif}
.chap small{display:block;font:400 14px 'DM Sans',sans-serif;color:var(--page-sub);margin-top:4px}
.ticks{display:flex;gap:4px;margin:14px 0 6px;max-width:420px}
.ticks span{flex:1;height:8px;border-radius:2px;background:rgba(127,127,127,.25)}
.ticks span.done{background:var(--page-green)}[data-theme=dark] .ticks span.done{background:var(--page-mint)}
.ticks span.cur{background:var(--page-orange)}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;cursor:pointer}
.btn.pri{background:var(--page-green);border-color:var(--page-green);color:#fff}
.recs{margin-top:44px;padding-top:28px;border-top:1px solid rgba(127,127,127,.25);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.recs h3{font:700 24px 'Space Grotesk',Georgia,serif;margin:0 0 4px}.recs p{margin:0;text-align:left}
.stack{display:flex}.stack div{width:54px;height:80px;border-radius:3px;margin-left:-18px;box-shadow:0 4px 10px rgba(0,0,0,.3);background:#7C9A5E center/cover no-repeat}
.stack div:first-child{margin-left:0}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);background:var(--page-bg);color:var(--page-text);box-shadow:0 30px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,20,16,.6)}
.dq{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:28px}
.dq .big{width:200px;height:300px;border-radius:4px;background:#3D6C8C center/cover no-repeat;box-shadow:0 10px 22px rgba(0,0,0,.35)}
.dq .count{font-size:13px;color:var(--page-sub)}
.dq h4{font:700 26px/1.15 'Space Grotesk',Georgia,serif;margin:6px 0 2px}
.dq .why{margin:16px 0;padding:12px 14px;border-radius:8px;background:rgba(127,127,127,.12);font-size:14px;line-height:1.45}
.dq .why b{color:var(--page-orange)}
.dq .tags{display:flex;gap:6px;flex-wrap:wrap}.dq .tags span{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid rgba(127,127,127,.45)}
.dq .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.dqfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-top:1px solid rgba(127,127,127,.25)}
.dqfoot .dots{display:flex;gap:5px}.dqfoot .dots i{width:8px;height:8px;border-radius:50%;background:rgba(127,127,127,.35)}.dqfoot .dots i.on{background:var(--page-orange)}
.dqend{padding:40px 28px;text-align:center}
@media (max-width:600px){.now{grid-template-columns:100px 1fr;gap:16px}.now .cv{width:100px;height:150px}.dq{grid-template-columns:1fr}.dq .big{width:140px;height:210px;margin:0 auto}}

<style id="app-css">
.inner{padding:0 48px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{text-align:left;margin:0;font-size:clamp(24px,4vw,34px)}.pagehead p{margin:6px 0 0;text-align:left;font-size:15px}
.card{border:1px solid rgba(127,127,127,.3);border-radius:12px;padding:18px;background:rgba(127,127,127,.06)}
.card .ct{font:700 20px Space Grotesk,system-ui,sans-serif;margin:0 0 10px}.card .ct small{font:500 13px 'DM Sans',sans-serif;color:var(--page-sub)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--page-green);border-color:var(--page-green);color:#fff}
.chip:focus-visible,.btn:focus-visible,.lnk:focus-visible,.search input:focus-visible{outline:2px solid var(--page-orange);outline-offset:2px}
.chip.chk{cursor:pointer}.chip.chk input{margin:0}
.hint{color:var(--page-sub);font-size:14px;margin:0}
.lnk{font:inherit;color:var(--page-orange);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.btn.danger{color:#c0392b;border-color:#c0392b}[data-theme=dark] .btn.danger{color:#ff8a7a;border-color:#ff8a7a}
.btn:disabled{opacity:.5;cursor:default}
.also{margin:14px 0 0;font-size:14px;color:var(--page-sub)}
.goalbar{margin-top:36px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;font-size:15px}
.goalbar .bar{min-width:120px}
.rcs{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.rc{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px;border:1px solid rgba(127,127,127,.3);border-radius:12px;background:rgba(127,127,127,.05)}
.rc .cv2{width:96px;height:144px;border-radius:4px;background:#3D6C8C center/cover no-repeat;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.rc h4{font:700 18px/1.2 Space Grotesk,system-ui,sans-serif;margin:0}.rc .sub{color:var(--page-sub);font-size:13px;margin-top:2px}
.rc .why{font-size:13px;line-height:1.45;margin:8px 0}.rc .why b{color:var(--page-orange)}
.rc .tags{display:flex;gap:6px;flex-wrap:wrap}.rc .tags span{font-size:12px;padding:3px 8px;border-radius:20px;border:1px solid rgba(127,127,127,.45)}
.rc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:12px}
.kpi b{display:block;font:700 30px Space Grotesk,system-ui,sans-serif}.kpi small{color:var(--page-sub)}
.ringcard{display:flex;gap:18px;align-items:center}.ringcard p{margin:0;text-align:left;font-size:15px}
.stepper{display:flex;align-items:center;gap:10px;font-size:14px}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;height:160px}
.mb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.mb i{display:block;width:100%;background:var(--page-green);border-radius:3px 3px 0 0;min-height:2px}[data-theme=dark] .mb i{background:var(--page-mint)}.mb i.cur{background:var(--page-orange)}
.mb small,.mv{font-size:11px;color:var(--page-sub);height:14px}
.dist .d{display:grid;grid-template-columns:36px 1fr 24px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.club .ticks{max-width:none}
.mem{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;gap:2px 10px;align-items:center;margin:12px 0}
.mem .av{grid-row:1/3}.mem .mn{font-weight:600;font-size:14px}.mem .mp{font-size:12px;color:var(--page-sub);justify-self:end}.mem .bar{grid-column:2/4;height:5px}
.mem .bar i{width:0;background:var(--page-green)}[data-theme=dark] .mem .bar i{background:var(--page-mint)}
.av{width:34px;height:34px;border-radius:50%;background:#7C9A5E;color:#fff;font:600 12px 'DM Sans',sans-serif;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.me{background:var(--page-orange)}.av.big{width:72px;height:72px;font-size:24px}
.chsel{font-size:14px;color:var(--page-sub);display:flex;gap:8px;align-items:center}
select,input[type=text],input[type=date],input[type=number],input:not([type]),textarea{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;background:var(--page-bg);color:inherit;border:1px solid rgba(127,127,127,.45)}
.post{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(127,127,127,.2)}.post p{margin:4px 0 0;font-size:15px;line-height:1.5;text-align:left;max-width:none}.post small{color:var(--page-sub)}
.lock{display:flex;gap:12px;align-items:center;padding:18px;border-radius:10px;background:rgba(127,127,127,.12)}.lock small{color:var(--page-sub)}
.composer{display:flex;gap:10px;margin-top:14px}.composer input{flex:1;min-width:0}
.profhead{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.sec{margin-bottom:16px;text-align:left}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(127,127,127,.15)}.prow:last-child{border:0}
.fld{margin-top:14px;text-align:left}.fld label,.fld .lab{display:block;font-size:13px;color:var(--page-sub)}.fld label output{float:right;color:var(--page-text)}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld input:not([type]),.fld select,.fld textarea{display:block;width:100%;margin-top:6px}.fld input[type=range]{display:block;width:100%;margin-top:8px;accent-color:var(--page-orange)}
.sec .fld input,.sec .fld select{max-width:360px}
.filebtn{display:inline-block}
.fmbody{padding:24px;min-width:min(420px,88vw)}
.dq .sub{color:var(--page-sub);margin-top:2px}.dq .acts .btn.danger{margin-left:auto}

 .hgrid .now,.hgrid .goalbar,.hgrid .recs,.hgrid .hside>*{order:0}
 .hmain .recs{flex-direction:column;align-items:flex-start}
 .now{grid-template-columns:170px 1fr}.now .cv{width:170px;height:255px}
 .inner{padding:0 40px}.row h3,.track{padding-left:40px;padding-right:40px}
 .search{margin-left:0;padding:0 40px;max-width:680px}.results{left:40px;right:40px}
}
/* type: Space Grotesk headings, DM Sans body, Newsreader italic accents */
h1,h2,.now h2,.land h2{letter-spacing:-.025em;font-weight:700}
.land h2 em,.pagehead h2 em{font:italic 500 1.08em Newsreader,Georgia,serif;color:var(--page-green);letter-spacing:-.01em}
body[data-theme=dark] .land h2 em{color:var(--page-mint)}
.now .by,.rc .sub,.dq .sub,.cover i,.frow .fs{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:500;text-transform:none;letter-spacing:0}
.now .by{font-size:20px}.rc .sub{font-size:15px}.cover i{font-size:13px;opacity:.9}
.now .chap{font-family:'Space Grotesk',sans-serif}
.now .chap small{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:15px}
.kpi b,.match b,.goalbar b{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
.now .lbl,.rnew,.rel .tag,#acctmenu .am-lbl{font-family:'Space Grotesk',sans-serif;letter-spacing:.1em}
.pick{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;font-weight:600}.pick input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--page-green)}
.fld label.pick,label.pick{display:flex!important;flex-direction:row;align-items:center;gap:14px}.fld label.pick span{display:inline;margin:0}
#bell{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:inherit;display:grid;place-items:center;cursor:pointer;padding:0}
#bell[hidden]{display:none}
#bell .bn{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--page-orange);color:#fff;font:700 11px/18px 'DM Sans',sans-serif;text-align:center;font-style:normal;box-sizing:border-box}
#bell .bn[hidden]{display:none}
#notifmenu{position:absolute;top:64px;right:24px;z-index:40;width:min(380px,calc(100vw - 20px));max-height:calc(100dvh - 90px);overflow-y:auto;background:var(--page-bg);color:var(--page-text);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:8px}
#notifmenu .am-lbl{font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--page-sub);padding:8px 10px 4px}
#notifmenu .am-sep{height:1px;background:var(--line);margin:6px 4px}
#notifmenu .am-i{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:10px;border:0;background:transparent;color:inherit;border-radius:8px;cursor:pointer}
#notifmenu .am-i:hover{background:rgba(127,127,127,.15)}
.nrow{padding:10px;border-radius:12px;display:flex;flex-direction:column;gap:8px}.nrow.un{background:color-mix(in srgb,var(--page-green) 9%,transparent)}
.nrow .na{display:flex;gap:8px;flex-wrap:wrap}.nrow .btn{padding:7px 14px;font-size:14px;min-height:0}
@media (max-width:700px),(hover:none) and (max-width:900px){#notifmenu{top:52px;right:10px;position:fixed}#bell{width:34px;height:34px}}
@media (min-width:901px),(min-width:701px) and (hover:hover){#notifmenu{position:fixed;top:64px;right:28px}}
#acctmenu .am-th .chv{flex:none;color:var(--page-sub);transition:transform .15s}#acctmenu .am-th[aria-expanded=true] .chv{transform:rotate(180deg)}#acctmenu .am-th[aria-expanded=true]~.am-t{padding-left:22px}
.res{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:12px}
.res .resmain{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:transparent;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;border-radius:10px}
.res .resmain:hover .tx b,.res .resmain:focus-visible .tx b{text-decoration:underline}
.res .th{display:block;width:64px;height:96px;flex:none;border-radius:6px;background:#7C9A5E center/cover no-repeat;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.res .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.res .tx b{white-space:normal;overflow:visible;text-overflow:clip;font:700 16px/1.25 'Space Grotesk',system-ui,sans-serif}
.res .tx small{display:block;font-size:13px}.res .tx .more{color:var(--page-orange);font-weight:600;margin-top:2px}
.res .resact{display:flex;gap:8px;align-items:center}
.res .resact select{flex:1;min-width:0;min-height:40px;font-size:14px;padding:6px 10px;border-radius:10px}
.res .resact button{min-height:40px;padding:6px 18px;border-radius:10px;font-weight:600;font-size:14px}
.res .resact button:disabled{opacity:.7}
.row h3 .fold{display:inline-flex;align-items:baseline;gap:8px;background:none;border:0;padding:4px 6px 4px 0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;border-radius:8px}
.row h3 .fold .chv{align-self:center;flex:none;transition:transform .15s;color:var(--page-sub)}
.row.shut h3 .fold .chv{transform:rotate(-90deg)}
.row.shut{margin-bottom:8px}
.row h3 .fold:hover .chv{color:var(--page-text)}
.ordlist{display:flex;flex-direction:column;gap:8px}
.ord{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surf);cursor:grab}
.ord.dragging{opacity:.45}
.ord .grip{color:var(--page-sub);display:grid;place-items:center;flex:none}
.ord .on{flex:1;min-width:0;display:flex;flex-direction:column}.ord .on b{font:700 16px 'Space Grotesk',system-ui,sans-serif}.ord .on small{color:var(--page-sub);font-size:13px}
.ord .mv{min-width:44px;min-height:44px;padding:0;font-size:20px;line-height:1}
.search.flat{padding:0;margin:0 0 22px;max-width:680px}.search.flat .results{left:0;right:0}
.page>.search:first-child{margin-top:0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surf);gap:2px}
.seg button{border:0;background:transparent;color:inherit;font:600 14px/1 inherit;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--tab-on,#2f5d50);color:#fff}
.lbl2{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.pgnum{display:flex;align-items:center;gap:10px;margin-top:10px}
.pgnum input{width:110px}
.pgform{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.pgform label{display:flex;align-items:center;gap:8px;font-weight:600}
.pgform input{width:100px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:inherit;font:inherit}
.delsh{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--page-orange,#c0431f);cursor:pointer}
.delsh:hover,.delsh:focus-visible{background:color-mix(in srgb,var(--page-orange,#c0431f) 14%,transparent)}
</style>

 async getData(){const{data,error}=await cloud.sb.from('user_data').select('data').eq('user_id',cloud.user.id).maybeSingle();if(error)throw error;return data&&data.data},

  try{const r=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(t)+'&author='+encodeURIComponent(a)+'&limit=1&fields=cover_i');const j=await r.json();if(j.docs&&j.docs[0]&&j.docs[0].cover_i)url='https://covers.openlibrary.org/b/id/'+j.docs[0].cover_i+'-M.jpg'}catch(e){err=true}
  if(!url){try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=1&q='+encodeURIComponent('intitle:'+t+' inauthor:'+a));const j=await r.json();const im=j.items&&j.items[0].volumeInfo.imageLinks;if(im)url=(im.thumbnail||im.smallThumbnail).replace('http:','https:');err=false}catch(e){err=true}}
  if(url||!err){covers[k]=url||'';saveCovers()}inflight.delete(k);return url});
 inflight.set(k,p);return p}
async function paint(el){const url=el.dataset.img||await findCover(el.dataset.t,el.dataset.a);if(!url||!el.isConnected)return;
 const im=new Image();im.alt='';im.onload=()=>{if(im.naturalWidth<5||!el.isConnected)return;
  if(el.classList.contains('cover')){el.prepend(im);el.classList.add('hasimg');requestAnimationFrame(()=>im.classList.add('ok'))}else el.style.backgroundImage='url("'+url+'")'};im.src=url}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);paint(e.target)}}),{rootMargin:'250px'}):null;
const lazy=root=>{$$('[data-cv]',root).forEach(el=>io?io.observe(el):paint(el));requestAnimationFrame(()=>$$('.track',root).forEach(arrows))};
function arrows(t){const r=t.parentElement,l=$('.l',r),x=$('.r',r);if(!l)return;l.disabled=t.scrollLeft<5;x.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-5}
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('track'))arrows(e.target)},true);

/* ---------- recommendation engine: scores the catalog against your ratings ---------- */
function recommend(mood){
 const w={},au={};
 S.books.forEach(b=>{const s=b.shelf==='finished'?(b.rating!=null?b.rating-3:.5):b.shelf==='dnf'?-1.5:b.shelf==='reading'?.5:.25;
  b.tags.forEach(t=>w[t]=(w[t]||0)+s);au[b.a]=(au[b.a]||0)+s});
 Object.keys(S.liked).forEach(t=>w[t]=(w[t]||0)+.6*S.liked[t]);Object.keys(S.nope).forEach(t=>w[t]=(w[t]||0)-.8*S.nope[t]);
 const seen=new Set(S.books.map(b=>b.id).concat(S.dismissed));
 const src=S.books.filter(b=>(b.shelf==='finished'&&b.rating>=3.5)||b.shelf==='reading');
 return CAT.filter(c=>!seen.has(c.id)&&(!mood||c.tags.includes(mood))).map(c=>{
  const sc=c.tags.reduce((a,t)=>a+(w[t]||0),0)/Math.sqrt(c.tags.length)+2*(au[c.a]||0);
  let best=null,bv=-1,shared=[];
  src.forEach(b=>{const sh=b.tags.filter(t=>c.tags.includes(t));const v=sh.length*(b.rating!=null?b.rating-3:.5)+(b.a===c.a?5:0);if(v>bv){bv=v;best=b;shared=sh}});
  return{c,sc,why:why(c,best,shared)}}).sort((x,y)=>y.sc-x.sc)}

/* ---------- lanes: close matches, friends, stretch picks, something different ---------- */
const GENRES=new Set(['Romance','Fantasy','Science fiction','Memoir','Academic','Thriller','Informative','Literary','Historical','Mystery','Horror']);
const gOf=c=>c.tags.filter(t=>GENRES.has(t)),mOf=c=>c.tags.filter(t=>!GENRES.has(t));
function taste(){const g={},m={},tried=new Set();
 S.books.forEach(b=>{const s=b.shelf==='finished'?(b.rating!=null?b.rating-3:.5):b.shelf==='dnf'?-1.5:b.shelf==='reading'?.5:.25;
  b.tags.forEach(t=>{const o=GENRES.has(t)?g:m;o[t]=(o[t]||0)+s;if(GENRES.has(t))tried.add(t)})});
 Object.keys(S.liked).forEach(t=>{const o=GENRES.has(t)?g:m;o[t]=(o[t]||0)+.6*S.liked[t]});
 Object.keys(S.nope).forEach(t=>{const o=GENRES.has(t)?g:m;o[t]=(o[t]||0)-.8*S.nope[t]});
 return{g,m,tried}}
function lanes(mood){
 const{g,m,tried}=taste(),seen=new Set(S.books.map(b=>b.id).concat(S.dismissed)),used=new Set(),out=[];
 const bad=c=>c.tags.some(t=>(S.nope[t]||0)>=2);
 const take=(arr,n)=>{const r=arr.slice(0,n);r.forEach(x=>used.add(x.c.id));return r};
 const diverse=(arr,n,per)=>{const cnt={},r=[];for(const x of arr){const k=gOf(x.c)[0]||'x';if((cnt[k]||0)>=per)continue;cnt[k]=(cnt[k]||0)+1;r.push(x);if(r.length>=n)break}return r};
 const pool=CAT.filter(c=>!seen.has(c.id)&&(!mood||c.tags.includes(mood)));
 const fav=S.books.filter(b=>b.shelf==='finished'&&b.rating>=4).sort((a,b)=>b.rating-a.rating)[0];
 const anchor=mo=>S.books.filter(b=>b.shelf==='finished'&&b.rating>=3.5&&b.tags.includes(mo)).sort((a,b)=>b.rating-a.rating)[0];
 const SI=[];(cloud.user?(cloud.recs||[]):[]).forEach(r=>{const id=key(r.title,r.author);if(seen.has(id)||SI.some(x=>x.c.id===id)||(mood&&!(r.tags||[]).includes(mood)))return;const c=regCat(id,{t:r.title,a:r.author,tags:r.tags||[],pages:r.pages||0});SI.push({c,sc:0,why:`<b>${esc(r.from_name)}</b> recommends this${r.note?': \u201c'+esc(r.note)+'\u201d':'.'}`})});
 if(SI.length)out.push({k:'sent',title:'Sent to you by friends',sub:'Personal picks from people who know you.',items:take(SI,6)});
 const L1=take(recommend(mood).filter(r=>gOf(r.c).some(t=>g[t]>0)&&r.sc>0),6);
 if(L1.length)out.push({k:'close',title:fav?'Because you loved '+fav.t:'More of what you love',sub:'The closest matches to the books you rated highly.',items:L1});
 const fr=cloud.user?(cloud.friends||[]).filter(f=>f.status==='accepted'):[],fm={};
 fr.forEach(f=>(f.shared||[]).forEach(x=>{if(!(x.r>=4))return;const id=key(x.t,x.a);if(seen.has(id)||used.has(id))return;(fm[id]=fm[id]||{x,by:[]}).by.push({n:f.name,r:x.r})}));
 const FI=Object.keys(fm).filter(id=>!mood||(fm[id].x.tg||[]).includes(mood)).map(id=>{const v=fm[id],c=CATID[id]||{id,t:v.x.t,a:v.x.a,tags:v.x.tg||[],pages:v.x.p||0};CATID[id]=c;
  const n=v.by.map(b=>'<b>'+esc(b.n)+'</b>'),avg=v.by.reduce((a,b)=>a+b.r,0)/v.by.length;
  const why=v.by.length===1?`${n[0]} rated this ${v.by[0].r} out of 5.`:v.by.length===2?`${n[0]} and ${n[1]} both rated this highly.`:`${n[0]}, ${n[1]} and ${v.by.length-2} more friend${v.by.length>3?'s':''} rated this highly.`;
  return{c,sc:v.by.length*10+avg,why}}).sort((a,b)=>b.sc-a.sc);
 if(FI.length)out.push({k:'friends',title:'Friends loved these',sub:'Books your friends rated 4 stars or more that are not on your shelves yet.',items:take(FI,6)});
 const st=pool.filter(c=>!used.has(c.id)&&!bad(c)).map(c=>{const cg=gOf(c);if(!cg.length||cg.some(t=>g[t]>0))return null;const sh=mOf(c).filter(t=>m[t]>0);if(!sh.length)return null;
  const mo=sh.sort((a,b)=>m[b]-m[a])[0],b=anchor(mo);
  return{c,sc:sh.reduce((a,t)=>a+m[t],0),why:`New genre, familiar feel. You enjoy <b>${esc(mo.toLowerCase())}</b> reads${b?', like <b>'+esc(b.t)+'</b>':''}, and this one is ${esc(cg[0].toLowerCase())}.`}}).filter(Boolean).sort((x,y)=>y.sc-x.sc);
 const L2=take(diverse(st,4,1),4);
 if(L2.length)out.push({k:'stretch',title:'Stretch picks',sub:'A new genre with a feel you already love, so it is an easy step outside your usual.',items:L2});
 const day=Math.floor(Date.now()/864e5),hs=s=>[...s].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);
 const df=pool.filter(c=>!used.has(c.id)&&!bad(c)).filter(c=>{const cg=gOf(c);return cg.length&&cg.every(t=>!tried.has(t))}).map(c=>({c,sc:(hs(c.id)+day)%1000,
  why:`A genre you have not tried yet: <b>${esc(gOf(c)[0].toLowerCase())}</b>. ${c.pages<=320?'At '+c.pages+' pages it is an easy first step.':'A good place to start exploring it.'}`})).map(x=>({...x,sc:x.sc+(L2.some(y=>gOf(y.c).includes(gOf(x.c)[0]))?0:1000)})).sort((x,y)=>y.sc-x.sc);
 const L3=take(diverse(df,5,1),5);
 if(L3.length)out.push({k:'different',title:'Something different',sub:'Genres you have not tried yet. Low pressure, one book each.',items:L3});
 return out}
function topPicks(){const ls=lanes(),r=[];for(let i=0;i<3&&r.length<6;i++)ls.forEach(l=>{if(l.items[i]&&r.length<6)r.push(l.items[i])});
 if(r.length<6){const ids=new Set(r.map(x=>x.c.id));recommend().forEach(x=>{if(r.length<6&&!ids.has(x.c.id))r.push(x)})}return r}
function why(c,b,sh){
 if(!b||(!sh.length&&b.a!==c.a))return `Popular with readers who like <b>${esc(c.tags[0].toLowerCase())}</b> stories.`;
 const rated=b.rating!=null;
 return `You ${rated?'rated':'are reading'} <b>${esc(b.t)}</b>${rated?' '+b.rating+' '+unit(method(b),b.rating):''}`+(b.a===c.a?' and this is by the same author.':`. Shared vibe: ${sh.slice(0,3).map(x=>esc(x.toLowerCase())).join(', ')}.`)}

function catStats(rated){const rows=[['rating','Overall'],...CATS].map(([k,l])=>{const v=all_(k);return v}).filter(Boolean);
 function all_(k){const l=S.books.filter(b=>metric(b,k));if(!l.length)return null;const nm=k==='rating'?'Overall':(CATS.find(c=>c[0]===k)||[0,k])[1];return{nm,avg:l.reduce((a,b)=>a+metric(b,k),0)/l.length,n:l.length}}
 const ch=rated.filter(b=>method(b)==='chili'),st=rated.filter(b=>method(b)!=='chili'),av=l=>l.length?(l.reduce((a,b)=>a+b.rating,0)/l.length).toFixed(1):'';
 if(!rows.length)return '';
 return `<section class="card" style="margin-top:16px"><h3 class="ct">Your rankings</h3><div class="dist">${rows.map(r=>`<div class="d wide"><span>${r.nm}</span><div class="bar"><i style="width:${r.avg/5*100}%;display:block;height:100%;background:var(--page-orange)"></i></div><span>${r.avg.toFixed(1)}</span></div>`).join('')}</div>${ch.length?`<p class="hint" style="margin:8px 0 0">Romance, in chili peppers: ${av(ch)} average across ${ch.length}. Everything else, in stars: ${av(st)||'none yet'}.</p>`:''}</section>`}

 return `<div class="inner"><div class="pagehead"><div><h2>${n} books toward your goal of ${goal}</h2><p>${moods.length?`Most read mood this year: ${moods[0][0].toLowerCase()}. `:''}Average rating ${avg}.</p></div><div class="stepper" role="group" aria-label="Yearly goal"><button class="btn" data-act="goal" data-d="-1" aria-label="Lower goal">−</button><span>Goal ${goal}</span><button class="btn" data-act="goal" data-d="1" aria-label="Raise goal">+</button></div></div>
 <div class="grid"><section class="card ringcard"><svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="${n} of ${goal} books"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(127,127,127,.25)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--page-orange)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pct*ci} ${ci}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-family="Space Grotesk,system-ui,sans-serif" font-size="26" font-weight="700" fill="currentColor">${Math.round(pct*100)}%</text></svg><p>${msg}</p></section>
 <section class="card"><div class="stat-grid"><div class="kpi"><b>${n}</b><small>Finished in ${YEAR}</small></div><div class="kpi"><b>${pages.toLocaleString()}</b><small>Pages read</small></div><div class="kpi"><b>${withP.length?Math.round(pages/withP.length):0}</b><small>Avg pages per book</small></div></div>${long?`<p class="hint" style="margin:0">Longest read: <b>${esc(long.t)}</b> (${long.pages} pages)</p>`:''}</section></div>

function parseCSV(s){const rows=[];let r=[],f='',q=false;
 for(let i=0;i<s.length;i++){const c=s[i];
  if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){r.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else f+=c}
 if(f!==''||r.length){r.push(f);rows.push(r)}return rows}

 rows.slice(1).forEach(r=>{const t=(r[it]||'').replace(/\s*\([^)]*#[^)]*\)\s*$/,'').trim(),a=(r[ia]||'').trim();if(!t)return;
  if(bk(key(t,a))){skip++;return}
  const sh={read:'finished','currently-reading':'reading','to-read':'want'}[(r[is]||'').trim()]||'want',d=(r[id]||'').replace(/\//g,'-').slice(0,10);
  const cust=(r[ib]||'').split(',').map(x=>x.trim()).filter(x=>x&&!['read','to-read','currently-reading'].includes(x));

 S.profile.imported=(S.profile.imported||0)+add;save();toast('Imported '+nb(add)+(skip?' ('+skip+' already in your library)':''));render()}

 openForm('Recommend a book',`<div class="fld"><label>Friend<select name="f">${fr.map(f=>`<option value="${esc(f.id)}"${f.id===fidd?' selected':''}>${esc(f.name)}</option>`).join('')}</select></label></div><div class="fld"><label>Book<select name="b">${books.map(b=>`<option value="${esc(b.id)}"${b.id===bid?' selected':''}>${esc(b.t)}</option>`).join('')}</select></label></div><div class="fld"><label>Note <small class="hint">optional</small><textarea name="n" rows="2" maxlength="200" placeholder="Why you think they will love it" style="width:100%;box-sizing:border-box"></textarea></label></div>`,

function actCard(){if(!cloud.user)return '';const have=new Set(S.books.map(b=>b.id).concat(S.dismissed)),items=[];
 accepted().forEach(f=>(f.shared||[]).forEach(x=>{if(!x.f)return;const d=new Date(x.f+'T12:00:00');if(isNaN(d)||Date.now()-d>30*864e5)return;items.push({f,x,d})}));
 items.sort((a,b)=>b.d-a.d);const top=items.slice(0,4);if(!top.length)return '';
 return `<section class="card sec act"><h3 class="ct">Friend activity</h3>${top.map(({f,x,d})=>{const id=key(x.t,x.a);regCat(id,x);const days=Math.round((Date.now()-d)/864e5);return `<div class="frow"><span class="fn"><span><b>${esc(f.name)}</b> finished <i>${esc(x.t)}</i> and rated it ${x.r} of 5</span><small class="fs">${days<=0?'today':days===1?'yesterday':days+' days ago'}</small></span>${have.has(id)?'':`<span class="fbt"><button class="btn" data-act="rec-want" data-id="${esc(id)}">Want to Read</button></span>`}</div>`}).join('')}</section>`}
function nudgeCard(){if(!cloud.user||!S.notif.club)return '';let worst=null;
 cloud.clubs.forEach(c=>{const b=bk(c.bookId),me=b?b.cur:c.myCh;c.members.forEach(m=>{const gap=m.ch-me;if(gap>0&&(!worst||gap>worst.gap))worst={gap,c,n:m.n}})});
 if(!worst)return '';
 return `<section class="card sec nudge"><div><b>${esc(worst.n)} is ${worst.gap} chapter${worst.gap===1?'':'s'} ahead of you</b><p class="hint" style="margin:2px 0 0;text-align:left">in ${esc(worst.c.name)}. Catch up to join the chapter discussions.</p></div><button class="btn pri" data-act="gocl" data-id="${esc(worst.c.id)}">Open club</button></section>`}

 if(n.recs)(cloud.recs||[]).slice(0,5).forEach(r=>out.push({k:'r'+r.id,t:'rec',unseen:!S.nseen.includes(r.id),html:`<b>${esc(r.from_name)}</b> recommended <i>${esc(r.title)}</i>`,acts:`<button class="btn" data-act="nview">See in Discover</button>`}));
 if(n.club){let w=null;(cloud.clubs||[]).forEach(c=>{const b=bk(c.bookId),me=b?b.cur:c.myCh;c.members.forEach(m=>{const g=m.ch-me;if(g>0&&(!w||g>w.g))w={g,c,n:m.n}})});if(w)out.push({k:'c'+w.c.id,t:'club',unseen:1,html:`<b>${esc(w.n)}</b> is ${w.g} chapter${w.g===1?'':'s'} ahead in <b>${esc(w.c.name)}</b>`,acts:`<button class="btn" data-act="gocl" data-id="${esc(w.c.id)}">Open club</button>`})}
 return out}
const notifCount=()=>notifItems().filter(i=>i.unseen).length;
function notifHTML(){const it=notifItems();return `<div class="am-lbl">Notifications</div>`+(it.length?it.map(i=>`<div class="nrow${i.unseen?' un':''}"><div class="nt">${i.html}</div><div class="na">${i.acts}</div></div>`).join(''):'<p class="hint" style="padding:6px 10px 12px">You are all caught up.</p>')+`<div class="am-sep"></div><button class="am-i" data-act="nset">Notification settings</button>`}
function closeNotif(){const m=$('#notifmenu');if(m)m.remove()}
function bellMenu(){if($('#notifmenu'))return closeNotif();closeMenu();
 const m=document.createElement('div');m.id='notifmenu';m.setAttribute('role','dialog');m.setAttribute('aria-label','Notifications');m.innerHTML=notifHTML();$('header').appendChild(m);
 const ids=(cloud.recs||[]).map(r=>r.id).filter(x=>!S.nseen.includes(x));if(ids.length){S.nseen=S.nseen.concat(ids).slice(-200);save()}}
function refreshNotif(){const m=$('#notifmenu');if(m)m.innerHTML=notifHTML()}
function notifCard(){if(!cloud.user)return '';const N=S.notif,row=(k,l,d)=>`<label class="pick"><input type="checkbox" data-p2="notif" data-k="${k}"${N[k]?' checked':''}><span>${l}<small class="hint" style="display:block;font-weight:400">${d}</small></span></label>`;
 return `<section class="card sec" id="notifset"><h3 class="ct">Notifications</h3><p class="hint" style="margin:0 0 6px">Choose what shows in the bell and on your Home page. Turning one off only hides it.</p>${row('friends','Friend requests','When someone wants to connect.')}${row('invites','Club invites','When a friend invites you to a club.')}${row('recs','Book recommendations','When a friend sends you a book.')}${row('club','Club activity','When friends are ahead of you in a club.')}</section>`}

/* ---------- theme ---------- */
function theme(k){const T=THEMES.find(x=>x.k===k)||THEMES[0];document.body.dataset.theme=T.t;document.body.dataset.skin=T.s;document.body.dataset.tk=T.k;logo.src=T.t==='dark'?D:L;store.set('readers.theme',T.k)}
theme(store.get('readers.theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
</script></body></html>
